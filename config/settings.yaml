exchange:
  # Hard requirement: must stay true. Bot refuses to start if false.
  testnet: true
  pairs:
    - "BTC/USDT:USDT"
    - "ETH/USDT:USDT"
  timeframe: "5m"
  # Candle history depth for indicators
  ohlcv_limit: 100

strategy:
  ema_fast: 9
  ema_slow: 21
  rsi_period: 14
  rsi_long_max: 70
  rsi_short_min: 30

risk:
  # Aggressive demo profile: 5% per trade (was 1%)
  risk_per_trade_pct: 5.0
  reward_risk_ratio: 1.5
  stop_loss_pct: 1.5
  # Raised so a single 5% loss does not trip the daily brake
  max_daily_loss_pct: 15.0
  max_weekly_loss_pct: 30.0
  max_positions_per_pair: 1

bot:
  poll_seconds: 30
  close_on_kill: false
  # Timezone for daily/weekly loss windows (UTC)
  timezone: "UTC"
  log_level: "INFO"
